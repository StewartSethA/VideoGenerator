[frameworks.comfyui]
repo = "https://github.com/comfyanonymous/ComfyUI.git"
python = "3.12"
install = "requirements"
launch = "python main.py --listen 127.0.0.1 --port {port}"
native_ui = true
notes = "General node/workflow engine with broad image/video/audio model support."

[frameworks.wangp]
repo = "https://github.com/DeepBeepMeep/Wan2GP.git"
python = "3.11"
install = "requirements"
launch = "python wgp.py --server-port {port}"
native_ui = true
notes = "Local video-generation front end; launch flags may change upstream."

[frameworks.wan22]
repo = "https://github.com/Wan-Video/Wan2.2.git"
