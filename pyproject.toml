[project]
name = "videogenerator"
version = "0.1.0"
description = "Local-first storyboard, multitrack video editor and optional AI generators"
readme = "README.md"
authors = [
    { name = "copilot-swe-agent[bot]", email = "198982749+Copilot@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
models = [
    "accelerate==1.15.0",
    "diffusers==0.41.0",
    "huggingface-hub==1.33.0",
    "imageio==2.38.1",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.5.4",
    "pillow==12.3.0",
    "safetensors==0.8.0",
    "scipy==1.18.1",
    "sentencepiece==0.2.2",
    "torch==2.14.1",
    "transformers==5.19.0",
]

[project.scripts]
videogenerator = "videogenerator.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
